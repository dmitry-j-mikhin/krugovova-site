<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  html,body{margin:0;padding:0}
  .og{width:1200px;height:630px;display:grid;grid-template-columns:1fr 440px;
      background:var(--cream);position:relative;overflow:hidden}
  .og::before{content:"";position:absolute;left:0;top:0;bottom:0;width:26px;background:var(--sand)}
  .og__text{padding:0 56px 0 112px;display:flex;flex-direction:column;justify-content:center}
  .og__name{font-family:var(--font-head);font-weight:500;font-size:82px;line-height:1.05;
            color:var(--ink);margin:0}
  .og__rule{width:190px;height:1px;background:var(--sand);margin:38px 0 30px}
  .og__role{font-family:var(--font-body);font-weight:500;font-size:20px;line-height:1.7;
            letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:0}
  .og__photo{width:100%;height:100%;object-fit:cover;object-position:50% 30%}
</style></head><body>
<div class="og">
  <div class="og__text">
    <p class="og__name">Мария<br>Круговова</p>
    <div class="og__rule"></div>
    <p class="og__role">Клинический психолог<br>Психоаналитический психотерапевт</p>
  </div>
  <img class="og__photo" src="assets/img/portrait.jpg" alt="">
</div>
</body></html>
